name: Shell Stop diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-stop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Trace public waiting boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'src/sdk-runtime.shell-timeout.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace('const command =', 'const trace = (stage: string): void => { process.stderr.write(`[DEBUG-shellstop] ${stage}\\n`); };\nconst command =');
          for (const [before, after] of [
            ["explicitStop = mode === 'stopped';", "explicitStop = mode === 'stopped'; trace('setup');"],
            ['runId = run.runId;', "runId = run.runId; trace('run-started');"],
            ["await runtime.sessions.cancel({ sessionId: session.id, expectedRunId: run.runId, requestId: 'stop' });", "trace(`before-cancel exit=${cleanup.children.at(-1)?.exitCode}`); await runtime.sessions.cancel({ sessionId: session.id, expectedRunId: run.runId, requestId: 'stop' }); trace('cancelled');"],
            ['const queued = await runtime.runs.submitInput(input);', "const queued = await runtime.runs.submitInput(input); trace(`queued=${queued.accepted}`);"],
            ['let finished = false;', "trace('waiting-result'); let finished = false;"],
            ['const result = await run.result;', "const result = await run.result; trace(`result=${result.phase}`);"],
            ['const later = await runtime.runs.start', "trace('before-later'); const later = await runtime.runs.start"],
            ["await expect(later.result).resolves.toMatchObject({ phase: 'completed' });", "await expect(later.result).resolves.toMatchObject({ phase: 'completed' }); trace('later-finished');"],
            ["if (queuedRunId) await expect(runtime.runs.await(queuedRunId)).resolves.toMatchObject({ phase: 'completed' });", "if (queuedRunId) await expect(runtime.runs.await(queuedRunId)).resolves.toMatchObject({ phase: 'completed' }); trace('queued-finished');"],
            ['} finally {\n    cleanup.verified = true;', "} finally {\n    trace('finally'); cleanup.verified = true;"],
            ['if (runId && !closing) await runtime.runs.abort(runId);', "if (runId && !closing) await runtime.runs.abort(runId); trace('finally-aborted');"],
            ['await runResult;', "await runResult; trace('finally-result');"],
          ]) {
            if (!source.includes(before)) throw new Error(`Missing trace boundary: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(file, source);
          NODE
      - name: Repeat the original stopped Shell case
        shell: bash
        run: |
          for iteration in {1..10}
          do
            node node_modules/vitest/vitest.mjs run -c vitest.system.config.ts src/sdk-runtime.shell-timeout.test.ts -t 'stopped Shell' --reporter=verbose || exit "$?"
          done
