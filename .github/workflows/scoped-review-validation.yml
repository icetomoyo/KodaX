name: Scoped review release validation

on:
  push:
    branches: [codex/fix-scoped-review-release]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install and verify release sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          bwrap --ro-bind / / --unshare-net --unshare-pid --proc /proc true
      - name: Compile release native authority for glibc 2.28
        env:
          KODAX_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/build-linux-native.mjs
      - name: Build the repaired SDK and Host
        env:
          KODAX_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
          KODAX_NATIVE_PREBUILT: '1'
        run: npm run build
      - name: Type and ownership regressions
        run: |
          npm run typecheck
          node node_modules/vitest/vitest.mjs run packages/agent/src/memory-control/review-inbox.test.ts packages/coding/src/memory-runtime.test.ts packages/coding/src/learning-reviewer.test.ts src/sdk-runtime.memory-review.test.ts packages/llm/src/provider-request-observation.test.ts packages/coding/src/child-fallback.test.ts src/sdk-client.workflow-policy.test.ts --maxWorkers=2
      - name: Original bundled release gate
        run: npm run test:bundle
      - name: Repeat scoped startup cancellation and exactly-once recovery
        run: |
          node --test --test-name-pattern='bundled scoped daemon aborts' tests/bundled-memory-review-shutdown.test.mjs
          node --test --test-name-pattern='bundled scoped daemon aborts' tests/bundled-memory-review-shutdown.test.mjs
      - name: Original real POSIX sandbox concurrency gate
        env:
          KODAX_REAL_POSIX_SANDBOX: '1'
          SRT_DEBUG: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-posix-shell-policy.test.ts
