name: CI

# Verifies the declared runtime floor actually holds. `engines.node` is
# ">=20.0.0" across the root and every workspace package, but nothing was
# proving the suite runs on anything other than the release build's Node 22.
# This matrix runs the build + fast suite on the engines floor (20) and the
# build version (22), then runs the expensive contract/system tiers once on
# the supported runtime floor (20). That catches Node-version regressions
# without duplicating every subprocess and daemon test. Node 18 was dropped from the floor: the
# codebase relies on Node 20+ features (e.g. the RegExp `v` flag), so 18 is no
# longer supported.

on:
  push:
    branches: [KodaX, InfX]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      - name: Verify Linux sandbox namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          bwrap --ro-bind / / --unshare-net --unshare-pid --proc /proc true

      - name: Build packages
        run: npm run build:packages

      - name: Compile Linux native authority for glibc 2.28
        if: matrix.node == '22'
        run: node scripts/build-linux-native.mjs

      - name: Build trusted text native authority
        env:
          KODAX_NATIVE_PREBUILT: ${{ matrix.node == '22' && '1' || '0' }}
        run: npm run build:native

      - name: Enforce Linux glibc 2.28 ABI
        if: matrix.node == '22'
        run: node scripts/check-native-glibc.mjs --max 2.28 dist/native/linux-x64/kodax-text-transaction.node

      - name: Build bundled SDK and Worker sidecars
        run: npm run build:bundle

      - name: Native trusted text transaction tests
        if: matrix.node == '22'
        run: npm run test:native

      - name: Trusted text host integration
        if: matrix.node == '22'
        run: node node_modules/vitest/vitest.mjs run src/windows-text-transaction.test.ts src/windows-native-artifacts.test.ts

      - name: Real POSIX per-command sandbox concurrency gate
        if: matrix.node == '22'
        env:
          KODAX_REAL_POSIX_SANDBOX: '1'
          SRT_DEBUG: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-posix-shell-policy.test.ts

      - name: Build type declarations (SDK .d.ts — catches missing exports)
        run: npm run build:dts

      - name: Fast tests
        run: npm run test:fast

      - name: Unit tests
        if: matrix.node == '20'
        run: npm run test:unit

      - name: Contract tests
        if: matrix.node == '20'
        run: npm run test:contract

      - name: System tests
        if: matrix.node == '20'
        run: npm run test:system -- --no-file-parallelism --maxWorkers=1

      - name: Runtime daemon Unix socket gate
        if: matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail

          home_dir="$(mktemp -d)"
          profile="ci-unix-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}"
          cleanup() {
            rm -rf "$home_dir"
          }
          trap cleanup EXIT

          KODAX_UNIX_GATE_HOME="$home_dir" KODAX_UNIX_GATE_PROFILE="$profile" node --input-type=module <<'NODE'
          import path from 'node:path';
          import { readFile } from 'node:fs/promises';
          import { createKodaXRuntime, connectKodaXRuntime } from '@kodax-ai/kodax/runtime';

          const homeDir = process.env.KODAX_UNIX_GATE_HOME;
          const profile = process.env.KODAX_UNIX_GATE_PROFILE;
          if (!homeDir || !profile) {
            throw new Error('Missing Unix runtime gate environment.');
          }

          const capabilities = {
            richEvents: true,
            permissionPrompts: true,
            contextDiagnostics: true,
          };
          let first;
          let second;
          let eventSubscription;
          try {
            first = await createKodaXRuntime({
              mode: 'daemon',
              homeDir,
              profile,
              defaultProvider: 'mock-provider',
              clientInfo: { name: 'ci-unix-a', version: '0.7.66' },
              capabilities,
            });
            second = await connectKodaXRuntime({
              homeDir,
              profile,
              clientInfo: { name: 'ci-unix-b', version: '0.7.66' },
              capabilities,
            });

            const session = await first.sessions.create({ title: 'CI Unix Runtime Gate', projectPath: homeDir });
            const events = [];
            eventSubscription = second.events.subscribe({ sessionId: session.id }, (event) => {
              events.push(event.type);
              if (event.type !== 'permission.requested') return;
              const payload = event.payload;
              if (!payload || typeof payload !== 'object' || typeof payload.id !== 'string') return;
              void second.permissions.respond(payload.id, { type: 'allow_once' }, { runId: payload.runId });
            });
            await eventSubscription.ready;

            const decision = await first.permissions.request({
              sessionId: session.id,
              runId: 'ci-unix-permission-run',
              toolName: 'bash',
              inputPreview: 'echo ok',
            });
            await new Promise((resolve) => setTimeout(resolve, 25));

            const status = await second.status.snapshot();
            const pending = await second.permissions.listPending({ runId: 'ci-unix-permission-run' });
            const statePath = path.join(homeDir, '.kodax', 'runtime', 'daemon', profile, 'daemon.json');
            const state = JSON.parse(await readFile(statePath, 'utf8'));
            const endpoint = typeof state.endpoint === 'string' ? state.endpoint : '';
            const proof = {
              sameRuntime: first.identity.runtimeId === second.identity.runtimeId,
              endpointKind: endpoint.startsWith('\\\\.\\pipe\\') ? 'pipe' : 'unix',
              sessions: status.sessions.length,
              decisionType: decision.type,
              hasPermissionEvents: events.includes('permission.requested') && events.includes('permission.resolved'),
              pending: pending.length,
            };

            if (
              !proof.sameRuntime
              || proof.endpointKind !== 'unix'
              || proof.sessions !== 1
              || proof.decisionType !== 'allow_once'
              || !proof.hasPermissionEvents
              || proof.pending !== 0
            ) {
              throw new Error(`Unexpected Unix runtime proof: ${JSON.stringify(proof)}`);
            }
            console.log(JSON.stringify(proof));
          } finally {
            eventSubscription?.close();
            await second?.close();
            await first?.close();
          }
          NODE

  packaged-electron-daemon:
    name: packaged Electron daemon (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache packaged Electron smoke toolchain
        id: electron-smoke-cache
        uses: actions/cache@v5
        with:
          path: .electron-smoke/node_modules
          key: electron-smoke-${{ runner.os }}-electron-42.5.0-builder-25.1.8

      - name: Install packaged Electron smoke toolchain
        if: steps.electron-smoke-cache.outputs.cache-hit != 'true'
        run: npm install --prefix .electron-smoke --no-save --package-lock=false --no-audit --no-fund electron@42.5.0 electron-builder@25.1.8

      - name: Ensure packaged Electron binary
        run: node .electron-smoke/node_modules/electron/install.js

      - name: Build packaged Electron gate inputs
        run: npm run build

      - name: Windows native transaction and runner tests
        run: npm run test:native

      - name: Windows trusted text integration and dependency boundary
        run: node node_modules/vitest/vitest.mjs run src/windows-text-transaction.test.ts tests/feature-295-text-tool-boundary.test.ts

      - name: Activate Windows v2 sandbox for packaged Electron gate
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
        run: node scripts/prepare-windows-electron-sandbox.mjs

      - name: Windows v2 native policy concurrency gate
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
          KODAX_REAL_WINDOWS_SANDBOX_V2: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-windows-v2-policy.test.ts

      - name: Packaged Electron daemon gate
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
          KODAX_ELECTRON_SMOKE_HOME: ${{ runner.temp }}\kodax-electron-smoke-home
          KODAX_ELECTRON_DIST: ${{ github.workspace }}\.electron-smoke\node_modules\electron\dist
          KODAX_ELECTRON_BUILDER_CLI: ${{ github.workspace }}\.electron-smoke\node_modules\electron-builder\out\cli\cli.js
        run: npm run test:electron-daemon:built

  trusted-text-native-platforms:
    name: trusted text and POSIX sandbox (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      - name: Verify Linux sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          bwrap --ro-bind / / --unshare-net --unshare-pid --proc /proc true

      - name: Install macOS sandbox dependencies
        if: runner.os == 'macOS'
        run: brew install ripgrep socat

      - name: Compile Linux native authority for glibc 2.28
        if: runner.os == 'Linux'
        run: node scripts/build-linux-native.mjs

      - name: Build and test native trusted text authority
        env:
          KODAX_NATIVE_PREBUILT: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          npm run build:native
          npm run test:native
          node node_modules/vitest/vitest.mjs run src/windows-text-transaction.test.ts src/windows-native-artifacts.test.ts

      - name: Enforce Linux glibc 2.28 ABI
        if: runner.os == 'Linux'
        run: node scripts/check-native-glibc.mjs --max 2.28 dist/native/linux-arm64/kodax-text-transaction.node

      - name: Real POSIX per-command sandbox concurrency gate
        env:
          KODAX_REAL_POSIX_SANDBOX: '1'
          SRT_DEBUG: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-posix-shell-policy.test.ts

  shell-contract-windows:
    name: shell execution contract (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages and Runtime Worker
        run: |
          npm run build:packages
          npm run build:bundle

      - name: Shell contract Windows gate
        run: >-
          npx vitest run
          packages/llm/src/providers/runtime-registry.test.ts
          packages/coding/src/shell-execution/contract.test.ts
          packages/coding/src/shell-execution/environment.test.ts
          packages/coding/src/shell-execution/resolver.test.ts
          packages/coding/src/agent-runtime/tool-execution-context.test.ts
          packages/coding/src/task-engine/deterministic-evaluator.test.ts
          packages/coding/src/tools/bash.test.ts
          src/runtime-permission-scope.test.ts
          --no-file-parallelism
          --maxWorkers=1
          --reporter=dot

      - name: Runtime Session shell contract gate
        run: >-
          npx vitest run
          src/sdk-runtime.test.ts
          --testNamePattern "persists session settings and applies them as run defaults"
          --reporter=dot
