name: Release

# Two trigger paths share the same build matrix:
#   1. Push a `v*` tag         → build + auto-create GitHub Release with binaries
#   2. workflow_dispatch (UI)  → build only, artifacts available for manual download
#
# No code signing; binaries are distributed as tar.gz (Linux/macOS) and zip (Windows)
# with a sidecar `builtin/` directory next to the executable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win-x64
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64

permissions:
  contents: write   # Needed for softprops/action-gh-release on tag push

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            native_arch: x64
            native_dir: win32-x64
            archive: zip
            smoke: true
          - target: linux-x64
            runner: ubuntu-24.04
            native_arch: x64
            native_dir: linux-x64
            archive: tar.gz
            smoke: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            native_arch: arm64
            native_dir: linux-arm64
            archive: tar.gz
            smoke: true
          - target: darwin-x64
            runner: macos-15-intel
            native_arch: x64
            native_dir: darwin-x64
            archive: tar.gz
            smoke: true
          - target: darwin-arm64
            runner: macos-15
            native_arch: arm64
            native_dir: darwin-arm64
            archive: tar.gz
            smoke: true

    steps:
      - name: Filter by manual target
        id: filter
        shell: bash
        run: |
          requested="${{ github.event.inputs.target }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ -n "$requested" ] \
             && [ "$requested" != "all" ] \
             && [ "$requested" != "${{ matrix.target }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.target }} (requested: $requested)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.filter.outputs.skip == 'false'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        if: steps.filter.outputs.skip == 'false'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.filter.outputs.skip == 'false'
        run: npm ci

      - name: Install Linux sandbox dependencies
        if: steps.filter.outputs.skip == 'false' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      - name: Verify Linux sandbox namespaces
        if: steps.filter.outputs.skip == 'false' && runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          bwrap --ro-bind / / --unshare-net --unshare-pid --proc /proc true

      - name: Install macOS sandbox dependencies
        if: steps.filter.outputs.skip == 'false' && runner.os == 'macOS'
        run: brew install ripgrep socat

      - name: Install Rust native target
        if: steps.filter.outputs.skip == 'false' && matrix.target != 'win-x64'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux-x64) triple=x86_64-unknown-linux-gnu ;;
            linux-arm64) triple=aarch64-unknown-linux-gnu ;;
            darwin-x64) triple=x86_64-apple-darwin ;;
            darwin-arm64) triple=aarch64-apple-darwin ;;
          esac
          rustup target add "$triple"

      - name: Cache packaged Electron smoke toolchain
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        id: electron-smoke-cache
        uses: actions/cache@v5
        with:
          path: .electron-smoke/node_modules
          key: electron-smoke-${{ runner.os }}-electron-42.5.0-builder-25.1.8

      - name: Install packaged Electron smoke toolchain
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64' && steps.electron-smoke-cache.outputs.cache-hit != 'true'
        run: npm install --prefix .electron-smoke --no-save --package-lock=false --no-audit --no-fund electron@42.5.0 electron-builder@25.1.8

      - name: Ensure packaged Electron binary
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        run: node .electron-smoke/node_modules/electron/install.js

      - name: Build
        if: steps.filter.outputs.skip == 'false'
        env:
          KODAX_NATIVE_TARGET_ARCH: ${{ matrix.native_arch }}
        run: npm run build

      - name: Native trusted text transaction tests
        if: steps.filter.outputs.skip == 'false' && matrix.smoke
        run: npm run test:native

      - name: Real POSIX per-command sandbox concurrency gate
        if: steps.filter.outputs.skip == 'false' && matrix.target != 'win-x64'
        env:
          KODAX_REAL_POSIX_SANDBOX: '1'
          SRT_DEBUG: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-posix-shell-policy.test.ts

      - name: Windows trusted text integration and dependency boundary
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        run: node node_modules/vitest/vitest.mjs run src/windows-text-transaction.test.ts tests/feature-295-text-tool-boundary.test.ts

      - name: Activate Windows v2 sandbox for packaged Electron release gate
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
        run: node scripts/prepare-windows-electron-sandbox.mjs

      - name: Windows v2 native policy concurrency gate
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
          KODAX_REAL_WINDOWS_SANDBOX_V2: '1'
        run: node node_modules/vitest/vitest.mjs run tests/feature-295-windows-v2-policy.test.ts

      - name: Packaged Electron daemon release gate
        if: steps.filter.outputs.skip == 'false' && matrix.target == 'win-x64'
        env:
          KODAX_HOME: ${{ runner.temp }}\kodax-electron-smoke-home\.kodax
          KODAX_ELECTRON_SMOKE_HOME: ${{ runner.temp }}\kodax-electron-smoke-home
          KODAX_ELECTRON_DIST: ${{ github.workspace }}\.electron-smoke\node_modules\electron\dist
          KODAX_ELECTRON_BUILDER_CLI: ${{ github.workspace }}\.electron-smoke\node_modules\electron-builder\out\cli\cli.js
        run: npm run test:electron-daemon:built

      - name: Build binary (${{ matrix.target }})
        if: steps.filter.outputs.skip == 'false'
        run: node scripts/build-binary.mjs --target=${{ matrix.target }} --skip-tsc

      - name: Smoke test
        if: steps.filter.outputs.skip == 'false' && matrix.smoke
        shell: bash
        run: |
          bin_dir="dist/binary/${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            "$bin_dir/kodax.exe" --version
          else
            chmod +x "$bin_dir/kodax"
            "$bin_dir/kodax" --version
          fi

      - name: Determine version
        if: steps.filter.outputs.skip == 'false'
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$v-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package archive
        if: steps.filter.outputs.skip == 'false'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          version="${{ steps.version.outputs.version }}"
          archive_base="kodax-v${version}-${target}"

          cd "dist/binary/${target}"

          sidecars=(
            builtin
            provider-capabilities.json
            semantic-worker.js
            runtime-worker.js
            constructed-handler-worker.js
          )
          # vendor/srt-win/<arch>/srt-win.exe is only produced for win-* targets
          # (build-binary step 5); other platforms have no vendor directory.
          if [ -d vendor ]; then
            sidecars+=(vendor)
          elif [ "${target#win-}" != "${target}" ]; then
            echo "Missing release sidecar: vendor (required for Windows targets)" >&2
            exit 1
          fi
          for sidecar in "${sidecars[@]}"; do
            test -e "$sidecar" || { echo "Missing release sidecar: $sidecar" >&2; exit 1; }
          done

          if [ "${{ matrix.archive }}" = "zip" ]; then
            archive_file="${archive_base}.zip"
            # Windows 10+ ships with bsdtar; powershell Compress-Archive also works.
            # Zip archives are Windows-only targets, so vendor/ is always present.
            powershell -Command "Compress-Archive -Path kodax.exe,builtin,provider-capabilities.json,semantic-worker.js,runtime-worker.js,constructed-handler-worker.js,vendor -DestinationPath '$archive_file' -Force"
          else
            archive_file="${archive_base}.tar.gz"
            tar -czf "$archive_file" kodax "${sidecars[@]}"
          fi

          mkdir -p "${GITHUB_WORKSPACE}/dist/release"
          mv "$archive_file" "${GITHUB_WORKSPACE}/dist/release/"
          cd "${GITHUB_WORKSPACE}"

          # SHA256 alongside archive
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist/release && sha256sum "$archive_file" > "${archive_file}.sha256" )
          else
            # macOS uses shasum
            ( cd dist/release && shasum -a 256 "$archive_file" > "${archive_file}.sha256" )
          fi

          echo "archive_file=$archive_file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.filter.outputs.skip == 'false'
        # Pinned to v6 (Node 24 runtime, classic backend) — deliberately NOT v7,
        # whose "Direct Uploads" rewrite changes the storage format. Pairs with
        # download-artifact@v7 below.
        uses: actions/upload-artifact@v6
        with:
          name: kodax-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload native authority for universal npm package
        if: steps.filter.outputs.skip == 'false'
        uses: actions/upload-artifact@v6
        with:
          name: native-authority-${{ matrix.target }}
          path: dist/native/${{ matrix.native_dir }}/*
          if-no-files-found: error
          retention-days: 14

  npm-package:
    name: Build universal npm package
    needs: build
    if: >-
      github.event_name == 'push'
      || github.event.inputs.target == 'all'
      || github.event.inputs.target == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: native-authority-win-x64
          path: dist/native/win32-x64
      - uses: actions/download-artifact@v7
        with:
          name: native-authority-linux-x64
          path: dist/native/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: native-authority-linux-arm64
          path: dist/native/linux-arm64
      - uses: actions/download-artifact@v7
        with:
          name: native-authority-darwin-x64
          path: dist/native/darwin-x64
      - uses: actions/download-artifact@v7
        with:
          name: native-authority-darwin-arm64
          path: dist/native/darwin-arm64

      - name: Build platform-neutral bundles around all native authorities
        run: |
          npm run build:packages
          npm run build:bundle
          npm run build:dts

      - name: Pack and audit universal npm package
        run: node scripts/release.mjs --skip-build --pack-only

      - name: Installed npm trusted text native gate
        run: npm run test:packed-native

      - name: Hash npm package
        shell: bash
        run: sha256sum kodax-ai-kodax-*.tgz > kodax-ai-kodax-npm.sha256

      - name: Upload universal npm package
        uses: actions/upload-artifact@v6
        with:
          name: kodax-npm-package
          path: |
            kodax-ai-kodax-*.tgz
            kodax-ai-kodax-npm.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, npm-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for changelog

      - name: Download all build artifacts
        # Pinned to v7 (Node 24 runtime, classic backend) — deliberately NOT v8,
        # whose "Direct downloads" change skips decompression by Content-Type and
        # could mangle the .zip release asset. We already pass merge-multiple, so
        # the v5 single-artifact path-behavior breaking change does not apply.
        uses: actions/download-artifact@v7
        with:
          pattern: kodax-*
          path: dist/release
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        shell: bash
        run: |
          cd dist/release
          ls -la
          # Collect per-archive .sha256 lines into a single SHA256SUMS file
          : > SHA256SUMS
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Generate release notes from git log
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Find previous canonical release tag by date. `--list 'v*'`
          # restricts to tags matching the release naming convention,
          # excluding local experiment tags (e.g. 'v0.7.27-DSready') that
          # would otherwise pollute the changelog range.
          prev=$(git tag --list 'v[0-9]*' --sort=-creatordate | grep -v "^${tag}$" | head -1 || true)
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
          else
            range="${tag}"
          fi

          {
            echo "body<<EOF"
            echo "## What's changed in ${tag}"
            echo
            git log --pretty=format:'- %s (%h)' "$range" || true
            echo
            echo
            echo "## Downloads"
            echo
            echo "Each archive contains the \`kodax\` executable, \`builtin/\`, provider metadata, and all required Worker sidecars."
            echo "Extract anywhere and run \`./kodax\` (or \`kodax.exe\` on Windows). No Node.js required."
            echo
            echo "Verify integrity with the matching \`.sha256\` file or the aggregated \`SHA256SUMS\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.tgz
            dist/release/*.sha256
            dist/release/SHA256SUMS
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
